services:
  db:
    image: postgres:16
    container_name: baraja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - baraja-pgdata:/var/lib/postgresql/data

volumes:
  baraja-pgdata:
