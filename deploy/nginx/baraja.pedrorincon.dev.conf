# Copia versionada de /etc/nginx/sites-available/baraja.pedrorincon.dev (VPS).
# La fuente de verdad operativa es el archivo del VPS (Certbot lo modifica al 
# renovar config); si se edita allí, actualizar esta copia.

server {
    server_name baraja.pedrorincon.dev;

    root /var/www/baraja;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(cards|textures)/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/baraja.pedrorincon.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/baraja.pedrorincon.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = baraja.pedrorincon.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name baraja.pedrorincon.dev;
    return 404; # managed by Certbot


}