# Copia versionada de /etc/nginx/sites-available/grafana.pedrorincon.dev (VPS).
# La fuente de verdad operativa es el archivo del VPS (Certbot lo modifica al 
# renovar config); si se edita allí, actualizar esta copia.

server {
    server_name grafana.pedrorincon.dev;

    location / {
        auth_basic "Zona restringida";
        auth_basic_user_file /etc/nginx/.htpasswd_grafana;
        proxy_set_header Authorization "";

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (Grafana Live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/grafana.pedrorincon.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/grafana.pedrorincon.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = grafana.pedrorincon.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name grafana.pedrorincon.dev;
    return 404; # managed by Certbot


}
