# Copia versionada de /etc/nginx/sites-available/baraja.pedrorincon.dev (VPS).
# La fuente de verdad operativa es el archivo del VPS (Certbot lo modifica al 
# renovar config); si se edita allí, actualizar esta copia.

server {
    listen 80;
    listen [::]:80;
    server_name grafana.pedrorincon.dev;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (Grafana Live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}