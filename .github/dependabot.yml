version: 2
updates:
  # 1) Dependencias npm (monorepo: un único package-lock.json en la raíz)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # Agrupa minor + patch en un PR; los mayors se gestionan en PR específico
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Prisma fijado en 6 a propósito (evaluar 7 más adelante)
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # dotenv-expand fijado en 13: la v1000 ejecuta $(comandos) al expandir el .env
      # y embebe @dotenvx/primitives. El repositorio no usa ninguna de las dos.
      - dependency-name: 'dotenv-expand'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'

  # 2 ) GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels: ['ci/cd', 'dependencies']
    commit-message:
      prefix: 'ci(deps)'

  # 3 ) Imagen base del Dockerfile (node:24-slim al día)
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'

  # 4 ) Generador del contrato (proyecto npm aislado, con su propio lock)
  - package-ecosystem: 'npm'
    directory: '/tools/openapi-gen'
    schedule:
      interval: 'weekly'
    ignore:
      # TypeScript fijado en 5: openapi-typescript emite el .d.ts con ts.factory
      # que el compilador nativo de TS 7 no expone
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
