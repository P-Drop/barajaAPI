name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: hSNYCyGEeuFMGiQnslWDOR6Jg5QOe3/hyq9uaMUK1Wqo
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate
        working-directory: apps/api

      - name: Aplicar migraciones
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Sembrar la base de datos
        run: npx prisma db seed
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Comprobar formato
        run: npm run format:check

      - name: Tests (e2e + cobertura)
        run: npm run test:coverage -w api

      - name: Cobertura de la API a Codecov
        uses: codecov/codecov-action@v7
        with:
          files: apps/api/coverage/lcov.info
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Tests de integración
        run: npm run test:integration -w api

      - name: Build
        run: npm run build -w api

      - name: Test del front (con cobertura)
        run: npm run test:coverage -w web

      - name: Cobertura de la API a Codecov
        uses: codecov/codecov-action@v7
        with:
          files: apps/web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build del front
        run: npm run build -w web
